# HolmesGPT CPU Model Evaluation Configuration

# Results directory
results_dir: results

# Classifier model for scoring (OpenAI or Azure)
classifier_model: gpt-4o

# Evaluation types to run
eval_types:
  - easy
  - medium

# Number of iterations per evaluation type
iterations:
  easy: 3
  medium: 2

# Parallel workers for model evaluation
parallel_workers: 1

# Models to evaluate
models:
  # Ollama models - various sizes and quantizations
  - name: llama2
    provider: ollama
    quantization: Q4_K_M
    size: 7B
    description: "Llama 2 7B with Q4 quantization"
    
  - name: llama2
    provider: ollama
    quantization: Q5_K_M
    size: 7B
    description: "Llama 2 7B with Q5 quantization"
    
  - name: llama2
    provider: ollama
    quantization: Q8_0
    size: 7B
    description: "Llama 2 7B with Q8 quantization"
    
  - name: llama2
    provider: ollama
    quantization: Q4_K_M
    size: 13B
    description: "Llama 2 13B with Q4 quantization"
    
  - name: mistral
    provider: ollama
    quantization: Q4_K_M
    size: 7B
    description: "Mistral 7B with Q4 quantization"
    
  - name: mistral
    provider: ollama
    quantization: Q5_K_M
    size: 7B
    description: "Mistral 7B with Q5 quantization"
    
  - name: codellama
    provider: ollama
    quantization: Q4_K_M
    size: 7B
    description: "Code Llama 7B with Q4 quantization"
    
  - name: phi2
    provider: ollama
    quantization: Q4_K_M
    size: 2.7B
    description: "Microsoft Phi-2 2.7B with Q4 quantization"
    
  - name: orca-mini
    provider: ollama
    quantization: Q4_K_M
    size: 3B
    description: "Orca Mini 3B with Q4 quantization"
    
  # AIKit models
  - name: llama2-chat-7b
    provider: aikit
    namespace: default
    description: "Llama 2 Chat 7B via AIKit"
    
  - name: mistral-7b-instruct
    provider: aikit
    namespace: default
    description: "Mistral 7B Instruct via AIKit"
    
  - name: falcon-7b-instruct
    provider: aikit
    namespace: default
    description: "Falcon 7B Instruct via AIKit"
    
  - name: phi-2
    provider: aikit
    namespace: default
    description: "Microsoft Phi-2 via AIKit"

# Test configurations
test_config:
  timeout: 120  # seconds per test
  max_retries: 2
  
# Resource monitoring
monitor_resources: true
resource_check_interval: 5  # seconds

# Baseline comparison model (optional)
baseline_model:
  name: gpt-4o
  provider: openai
  description: "GPT-4 baseline for comparison"