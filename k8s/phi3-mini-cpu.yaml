# Phi-3 Mini CPU Model Deployment for HolmesGPT Evaluation
# This creates a CPU-based inference service using standard Kubernetes resources

apiVersion: apps/v1
kind: Deployment
metadata:
  name: phi3-mini-cpu
  namespace: default
  labels:
    app: phi3-mini-cpu
    model: phi-3-mini-4k-instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phi3-mini-cpu
  template:
    metadata:
      labels:
        app: phi3-mini-cpu
    spec:
      nodeSelector:
        workload: cpu-inference
      tolerations:
      - key: inference
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: phi3-mini
        image: mcr.microsoft.com/onnxruntime/server:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MODEL_NAME
          value: "microsoft/Phi-3-mini-4k-instruct"
        - name: DEVICE
          value: "cpu"
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health  
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: phi3-mini-cpu-service
  namespace: default
  labels:
    app: phi3-mini-cpu
spec:
  selector:
    app: phi3-mini-cpu
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP