---
# ConfigMap with all model endpoints
apiVersion: v1
kind: ConfigMap
metadata:
  name: aikit-models-config
  namespace: default
data:
  models.json: |
    {
      "models": [
        {
          "name": "llama-3.2-1b-instruct",
          "endpoint": "http://llama32-1b-svc:8080",
          "parameters": "1B",
          "category": "small",
          "license": "Llama"
        },
        {
          "name": "llama-3.2-3b-instruct",
          "endpoint": "http://llama32-3b-svc:8080",
          "parameters": "3B",
          "category": "small",
          "license": "Llama"
        },
        {
          "name": "gemma-2-2b-instruct",
          "endpoint": "http://gemma2-2b-svc:8080",
          "parameters": "2B",
          "category": "small",
          "license": "Gemma"
        },
        {
          "name": "llama-3.1-8b-instruct",
          "endpoint": "http://llama31-8b-svc:8080",
          "parameters": "8B",
          "category": "medium",
          "license": "Llama"
        },
        {
          "name": "phi-4-14b-instruct",
          "endpoint": "http://phi4-14b-svc:8080",
          "parameters": "14B",
          "category": "medium",
          "license": "MIT"
        },
        {
          "name": "gpt-oss-20b",
          "endpoint": "http://gpt-oss-20b-svc:8080",
          "parameters": "20B",
          "category": "large",
          "license": "Apache 2.0"
        },
        {
          "name": "codestral-22b",
          "endpoint": "http://codestral-22b-svc:8080",
          "parameters": "22B",
          "category": "large",
          "license": "MNLP"
        }
      ]
    }