# AIKit Pre-made Models Deployment for HolmesGPT Evaluation
# Using actual AIKit supported models from ghcr.io/kaito-project/aikit

---
# Small Models (1B-3B) - Fast inference, lower accuracy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama32-1b
  labels:
    app: aikit-model
    model: llama32-1b
    size: small
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama32-1b
  template:
    metadata:
      labels:
        app: llama32-1b
    spec:
      containers:
      - name: model
        image: ghcr.io/kaito-project/aikit/llama3.2:1b
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama32-1b-svc
spec:
  selector:
    app: llama32-1b
  ports:
  - port: 8080
    targetPort: 8080
---
