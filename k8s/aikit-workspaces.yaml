---
# Service to expose inference endpoints
apiVersion: v1
kind: Service
metadata:
  name: aikit-inference-service
  namespace: default
  labels:
    app: holmesgpt-eval
spec:
  selector:
    app.kubernetes.io/name: workspace-inference
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  type: ClusterIP

---
# ConfigMap for HolmesGPT to discover AIKit endpoints
apiVersion: v1
kind: ConfigMap
metadata:
  name: aikit-model-endpoints
  namespace: default
data:
  models.yaml: |
    # AIKit Model Endpoints for HolmesGPT Evaluation
    # All models use GGUF format for efficient CPU inference
    models:
      - name: tinyllama-aikit
        provider: aikit
        endpoint: "http://tinyllama-workspace-inference.default.svc.cluster.local"
        model_name: "tinyllama"
        format: "gguf"
        quantization: "q4_k_m"
        parameters: "1.1B"
        file_size: "637MB"
        
      - name: phi3-aikit
        provider: aikit
        endpoint: "http://phi3-workspace-inference.default.svc.cluster.local"
        model_name: "phi-3-mini-4k-instruct"
        format: "gguf"
        quantization: "q4_k_m"
        parameters: "3.8B"
        file_size: "2.2GB"
        
      - name: phi3-q5-aikit
        provider: aikit
        endpoint: "http://phi3-q5-workspace-inference.default.svc.cluster.local"
        model_name: "phi-3-mini-4k-instruct"
        quantization: "q5_k_m"
        parameters: "3.8B"
        
      - name: code-llama-aikit
        provider: aikit
        endpoint: "http://code-llama-workspace-inference.default.svc.cluster.local"
        model_name: "code-llama-7b-instruct"
        quantization: "q4_k_m"
        parameters: "7B"
        
      - name: code-llama-q5-aikit
        provider: aikit
        endpoint: "http://code-llama-q5-workspace-inference.default.svc.cluster.local"
        model_name: "code-llama-7b-instruct"
        quantization: "q5_k_m"
        parameters: "7B"
        
      - name: code-llama-q8-aikit
        provider: aikit
        endpoint: "http://code-llama-q8-workspace-inference.default.svc.cluster.local"
        model_name: "code-llama-7b-instruct"
        quantization: "q8_0"
        parameters: "7B"