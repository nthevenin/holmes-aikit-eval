  inference:
    preset:
      name: "phi-3-mini-4k-instruct"
      # Request higher quality quantization
    presetOptions:
      quantization: "q5_k_m"
  tuning:
    method: "cpu-inference"
    config:
      max_seq_len: 4096
      temperature: 0.5
      top_p: 0.95

---
apiVersion: kaito.sh/v1alpha1
