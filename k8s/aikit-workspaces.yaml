# AIKit Workspaces for HolmesGPT CPU Model Evaluation
# Deploy CPU-optimized models via Kaito for performance testing

---
apiVersion: kaito.sh/v1alpha1
kind: Workspace
metadata:
  name: tinyllama-workspace
  namespace: default
  labels:
    app: holmesgpt-eval
    model: tinyllama
    format: gguf
spec:
  resource:
    instanceType: "Standard_D4as_v4"
    labelSelector:
      matchLabels:
        node-pool: cpu-inference
  inference:
    preset:
      name: "tinyllama"
      # GGUF format with Q4_K_M quantization for CPU optimization
    presetOptions:
      modelFormat: "gguf"
      quantization: "q4_k_m"
      llamacppArgs: "--mmap --numa --threads 4"
  tuning:
    # CPU-optimized configuration with GGUF
    method: "cpu-inference"
    config:
      max_seq_len: 2048
      temperature: 0.7
      top_p: 0.9
      # GGUF-specific optimizations
      use_mmap: true
      use_mlock: false

---
apiVersion: kaito.sh/v1alpha1
kind: Workspace
metadata:
  name: phi3-workspace
  namespace: default
  labels:
    app: holmesgpt-eval
    model: phi3
spec:
  resource:
    instanceType: "Standard_D4as_v4"
    labelSelector:
      matchLabels:
        node-pool: cpu-inference
  inference:
    preset:
      name: "phi-3-mini-4k-instruct"
      # AIKit supports multiple quantization levels
  tuning:
    method: "cpu-inference" 
    config:
      max_seq_len: 4096
      temperature: 0.5
      top_p: 0.95

---
